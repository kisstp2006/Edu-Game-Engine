version: v0.4-alpha.{build}
image: Visual Studio 2022
configuration:
- Debug
- Release
platform: x64
build_script:
- cmd: build.bat %CONFIGURATION% vs2022 build
before_package:
- ps: Copy-Item "build\vs2022\bin\$env:CONFIGURATION\Engine.exe" "Game\Engine.exe"
artifacts:
- path: Game
  name: game_files
deploy:
- provider: GitHub
  description: Test release
  auth_token:
    secure: jQJuY3qrofMwGeeOI09t523try6rsIrOkdIIEpLQN6gHcn3ypWKa55gdEMPR1bik
  artifact: game_files
  draft: false
  prerelease: true
  force_update: true
  on:
    CONFIGURATION: Release
